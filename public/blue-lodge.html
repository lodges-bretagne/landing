<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/">
    <script>
      // Redirect to index.html with the path as a query parameter
      var location = window.location
      var redirect = location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        '/?/' + 'blue-lodge'.replace(/&/g, '~and~') +
        (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      window.location.replace(redirect)
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">home page</a>...</p>
  </body>
</html>
