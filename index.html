<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#576572" />
    <meta name="description" content="Hébergements de charme à Saint-Malo et Dinard. Blue Lodge et Green Lodge : locations vacances bord de mer en Bretagne avec jardin, WiFi et parking privé." />
    <meta name="keywords" content="location vacances, Saint-Malo, Dinard, Bretagne, hébergement bord de mer, appartement, maison, Blue Lodge, Green Lodge" />
    <meta name="author" content="Lodges Bretagne" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Lodges Bretagne - Hébergements de charme à Saint-Malo et Dinard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Handle GitHub Pages SPA redirect before React loads
      // When 404.html redirects to /?/path, decode it and redirect properly
      (function() {
        var loc = window.location
        var search = loc.search
        
        // Check if we have the SPA redirect format: /?/path
        if (loc.pathname === '/' && search && search.startsWith('?/')) {
          // Extract everything after ?/
          var encoded = search.slice(2)
          
          // Split path and query params
          var parts = encoded.split('&')
          var encodedPath = parts[0]
          var queryParams = parts.slice(1)
          
          // Decode the path
          var decodedPath = encodedPath.replace(/~and~/g, '&')
          try {
            decodedPath = decodeURIComponent(decodedPath)
          } catch (e) {
            // If decoding fails, keep as is
          }
          
          // Ensure path starts with /
          if (decodedPath && !decodedPath.startsWith('/')) {
            decodedPath = '/' + decodedPath
          }
          
          // Reconstruct query string from remaining params
          var queryStr = ''
          if (queryParams.length > 0) {
            var decodedParams = queryParams.join('&').replace(/~and~/g, '&')
            queryStr = '?' + decodedParams
          }
          
          // Build final URL
          var finalUrl = decodedPath + queryStr + loc.hash
          
          // Update URL immediately (synchronously, before React loads)
          window.history.replaceState(null, '', finalUrl)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
